name: Refresh data and deploy

on:
  schedule:
    - cron: "0 6 * * *"      # every day at 06:00 UTC
  workflow_dispatch:          # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ["site/index.html", "*.py", "aliases.json", "classify.json", ".github/workflows/refresh.yml"]

# Least privilege: nothing by default, each job asks only for what it needs.
permissions: {}

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120      # a cold cache downloads ~1,400 Modern events (~40 min) once
    permissions:
      contents: write         # commit the refreshed site/data.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Downloaded sheets are kept between runs so each day only fetches new ones.
      - name: Restore sheet cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: sheets-${{ github.run_id }}
          restore-keys: sheets-

      - name: Download new sheets and rebuild data
        run: python -u build_data.py

      # Vintage and Modern have no community sheets: top-32 data from the Videre Project's public API.
      # If Videre is unreachable, the last committed site/data-vintage.json is deployed instead.
      - name: Rebuild Vintage data from Videre
        continue-on-error: true
        run: python -u build_videre.py vintage

      - name: Rebuild Modern data from Videre
        continue-on-error: true
        run: python -u build_videre.py modern

      # Saved even if a later step fails, so the next run does not start from scratch.
      - name: Save sheet cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: sheets-${{ github.run_id }}

      # site/data.json is generated, so if main moved meanwhile this run's fresh build wins
      # (-X theirs = the commit being replayed). A failed commit does not block the deploy.
      - name: Commit refreshed data
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json site/data-vintage.json site/data-modern.json
          if git diff --staged --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Refresh data $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase -X theirs "origin/$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Could not push refreshed data after 3 attempts" >&2
          exit 1

      - name: Build static site
        run: python build_pages.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write            # publish to GitHub Pages
      id-token: write         # proves to Pages that the deploy comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Refresh data and deploy

on:
  schedule:
    - cron: "0 6 * * *"      # every day at 06:00 UTC
  workflow_dispatch:          # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ["site/index.html", "*.py", "aliases.json", ".github/workflows/refresh.yml"]

permissions:
  contents: write             # commit the refreshed site/data.json
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Downloaded sheets are kept between runs so each day only fetches new ones.
      - name: Restore sheet cache
        uses: actions/cache@v4
        with:
          path: cache
          key: sheets-${{ github.run_id }}
          restore-keys: sheets-

      - name: Download new sheets and rebuild data
        run: python -u build_data.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh data $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - name: Build static site
        run: python build_pages.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
